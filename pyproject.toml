[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "route-licensing"
version     = "0.1.0"
description = "NTA public transport route licensing decision support system"
readme      = "README.md"
requires-python = ">=3.11"
license     = { text = "MIT" }

authors = [
    { name = "Your Organisation", email = "data@yourorg.ie" },
]

keywords = [
    "gtfs",
    "gtfs-realtime",
    "public-transport",
    "route-licensing",
    "nta",
    "ireland",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

# ── Core runtime dependencies ─────────────────────────────────────────────────
dependencies = [
    # Data ingestion
    "requests>=2.31.0",
    "partridge>=1.1.1",                    # GTFS static feed parser
    "gtfs-realtime-bindings>=1.0.0",       # NTA GTFS-R protobuf parser
    "protobuf>=4.25.0",

    # Data wrangling
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",                      # Excel read/write for timetable and demand uploads

    # Geospatial
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",                       # EPSG:2157 Irish Transverse Mercator

    # Machine learning
    "scikit-learn>=1.4.0",                 # DBSCAN corridor detection

    # API layer
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",

    # Configuration
    "python-dotenv>=1.0.0",

    # Templating
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

# ── Optional dependency groups ────────────────────────────────────────────────
[project.optional-dependencies]

# Analyst dashboard (Streamlit)
dashboard = [
    "streamlit>=1.35.0",
    "folium>=0.16.0",                      # interactive map layer
    "streamlit-folium>=0.20.0",
    "plotly>=5.22.0",
]

# Report generation (PDF and Word output)
reporting = [
    "reportlab>=4.2.0",                    # PDF generation
    "python-docx>=1.1.0",                  # Word document generation
    "jinja2>=3.1.0",                       # report templating
]

# Demand prediction ML model
ml = [
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "imbalanced-learn>=0.12.0",
]

# LLM narrative generation (Anthropic API)
llm = [
    "anthropic>=0.28.0",
]

# Development tooling
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",                       # FastAPI test client
    "ruff>=0.4.0",                         # linter and formatter
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pandas-stubs>=2.2.0",
    "types-requests>=2.31.0",
]

# Full install (all optional groups)
all = [
    "route-licensing[dashboard,reporting,ml,llm,dev]",
]

# ── Entry points ──────────────────────────────────────────────────────────────
[project.scripts]
route-licensing-api = "route_licensing.api.main:app"

# ── Hatch build configuration ─────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/route_licensing"]

# ── Ruff linter / formatter ───────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length    = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (ruff format handles this)
]

[tool.ruff.lint.isort]
known-first-party = ["route_licensing"]

# ── Mypy type checking ────────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true
plugins                = ["pydantic.mypy"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths       = ["tests"]
asyncio_mode    = "auto"
addopts         = "--cov=route_licensing --cov-report=term-missing"

[tool.coverage.run]
source  = ["route_licensing"]
omit    = ["tests/*"]

[tool.coverage.report]
fail_under = 80
